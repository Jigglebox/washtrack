<style>

* { box-sizing: border-box; }

.eyebrow { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 20px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar h1 { font-size: 18px; font-weight: 600; }
.topbar h1 small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface-2); padding: 3px; border-radius: 999px; }

.view { display: none; min-height: 0; }
.view.active { display: grid; }
#view-map { grid-template-columns: 250px minmax(0, 1fr) 360px; }
#view-flows { grid-template-columns: 280px minmax(0, 1fr); }

.rail { border-right: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 12px 10px; }
.rail input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--ground); color: var(--ink); font: inherit; margin-bottom: 10px; }
.rail .group { margin-bottom: 4px; }

.rail .group > button:hover, .rail .group > button[aria-current="true"] { background: var(--surface-2); }

.canvas .tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 2; }

/* svg */
.link { fill: none; stroke: var(--line-strong); stroke-width: 1.5; transition: opacity .15s, stroke .15s; }
.link.loose { stroke: var(--loose); stroke-dasharray: 5 4; }
.link.knot { stroke: var(--accent); stroke-width: 3; }
.link.grouplink { stroke-width: var(--w, 2); }
.link.hit { stroke: transparent; stroke-width: 14; cursor: pointer; }
.link.lit { stroke: var(--accent); stroke-width: 2.5; }
.link.lit.loose { stroke: var(--accent); }
.dim { opacity: .18; }
.node { cursor: pointer; }
.node rect { fill: var(--surface); stroke: var(--gc); stroke-width: 1.5; rx: 9; transition: stroke-width .15s; }

.node.hub rect { stroke-width: 2.5; }

.note { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: start; margin: 0 0 10px; font-size: 13px; }
.note .sev { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; color: var(--surface); background: var(--warn); }
.note .sev.medium { background: var(--muted); }
.note .rule { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
.note button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; }
.node.groupnode rect { fill: var(--surface); stroke-width: 2; }
.node.groupnode .fill { fill: var(--gc); opacity: .12; stroke: none; }
.node.groupnode text.title { font-size: 15px; }
.edgelabel { font-family: var(--font-body); font-size: 11px; fill: var(--muted); pointer-events: none; }
.edgelabel-bg { fill: var(--ground); }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--ground); padding: 7px 10px; border-radius: 8px; font-size: 13px; max-width: 320px; z-index: 5; box-shadow: var(--shadow); display: none; }

.panel { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 18px 20px 40px; }
.panel h2 { font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
.panel .sysname { color: var(--muted); }
.panel .what { font-size: 16px; margin: 12px 0 6px; max-width: 62ch; }
.panel .who { color: var(--muted); margin: 0 0 14px; }
.panel section { border-top: 1px solid var(--line); padding: 12px 0; }
.panel section h3 { font-size: 12px; font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

.panel li { display: flex; gap: 8px; align-items: baseline; }
.panel li .dot { position: relative; top: 1px; }
.panel li button.tl { color: var(--accent-ink); font-weight: 600; padding: 0; }
.panel li button.tl:hover { text-decoration: underline; }
.panel .empty { color: var(--muted); font-style: italic; }
.panel .stat { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }

.panel .stat b { font-family: var(--font-display); font-size: 16px; display: block; font-variant-numeric: tabular-nums; }
.panel details summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; }
.panel table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
.panel td { padding: 3px 6px 3px 0; vertical-align: top; border-top: 1px solid var(--line); }
.panel td:first-child { white-space: nowrap; }

.auto-note { display: flex; gap: 8px; align-items: flex-start; background: var(--auto-soft); border-radius: 8px; padding: 8px 10px; }
.auto-note b { color: var(--auto); font-family: var(--font-display); }
.loose-note { font-size: 13px; color: var(--muted); }
.overview p { max-width: 60ch; }

.flowlist { border-right: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 14px 10px; }
.flowlist button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-family: var(--font-display); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.flowlist button:hover { background: var(--surface-2); }
.flowlist button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.flowbody { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.flowbody .steps { padding: 18px 22px 8px; overflow: auto; }
.flowbody h2 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.steps li[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.steps li .n { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.steps li p { margin: 0 0 6px; max-width: 70ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 12px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.flowmap { position: relative; border-top: 1px solid var(--line); background: var(--ground); min-height: 220px; }
.flowmap svg { width: 100%; height: 100%; display: block; }
.flowmap .hint { position: absolute; top: 10px; left: 14px; font-size: 12px; color: var(--muted); }

/* words */
.words { padding: 26px 30px 60px; max-width: 900px; }
.words h2 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
.words .lede { color: var(--muted); max-width: 62ch; margin: 0 0 20px; }
.words dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 22px; max-width: 76ch; }
.words dt { font-family: var(--font-display); font-weight: 600; }
.words dd { margin: 0; }
.words .howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 14px 0 30px; }
.words .howto div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }

@media (max-width: 980px) {
  .app { height: auto; min-height: 100vh; }

  #view-flows { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .flowlist { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; }
  .flowlist button { white-space: nowrap; width: auto; }
  .flowbody { grid-template-rows: auto 300px; }
  .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</div>

<script>
const DATA = /*__DATA__*/{};
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const svgNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, ...kids) => { const n = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); for (const k of kids) n.append(k); return n; };
const h = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); } for (const k of kids) n.append(k); return n; };
const esc = (s) => String(s ?? '');

const tables = new Map(DATA.tables.map((t) => [t.name, t]));
const groups = DATA.groups;
const groupIndex = new Map(groups.map((g, i) => [g.name, i]));
const groupOf = (t) => tables.get(t)?.group;
const gcolor = (g) => `var(--g${(groupIndex.get(g) ?? 11) % 12})`;
const links = DATA.links;

// ---- words
const human = (s) => esc(s).replace(/^auth\./, 'login ').replace(/_/g, ' ');
const singular = (s) => { s = human(s); if (/ies$/.test(s)) return s.replace(/ies$/, 'y'); if (/(ss|us|is|map|log|data|info)$/.test(s)) return s; if (/ses$/.test(s)) return s.replace(/es$/, ''); if (/s$/.test(s)) return s.slice(0, -1); return s; };
const plural = (s) => human(s);
const label = (n) => tables.get(n)?.label || human(n);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const col = (c) => human(c).replace(/ id$/, '');
function phrase(l) {
  if (l.phrase) return l.phrase;
  const a = singular(l.from), b = singular(l.to), A = plural(l.from), B = plural(l.to);
  if (l.kind === 'junction') return `${cap(A)} and ${B} can be linked in any combination. The link is stored in “${label(l.via)}”.`;
  if (l.from === l.to) return `A ${a} can point at another ${a} (its “${col(l.cols[0])}”).`;
  if (l.kind === 'inferred') return `A ${a} names a ${b} in its “${col(l.cols[0])}” field, but nothing checks that the ${b} exists. A loose link.`;
  const one = l.one ? `has exactly one` : l.optional ? `may belong to one` : `belongs to one`;
  const many = l.one ? `has at most one ${a}` : `can have many ${A}`;
  return `Each ${a} ${one} ${b} (its “${col(l.cols.join(' + '))}”). A ${b} ${many}.`;
}

// ---- state
const state = { level: 'groups', group: null, selected: null, view: 'map' };

// ---- layout (tiny force simulation, seeded so it is stable)
function seeded(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 10000) / 10000; }; }
function layout(nodes, edges, W, H, opts = {}) {
  const rnd = seeded(nodes.length * 7919 + (opts.seed || 1));
  const pos = new Map(nodes.map((n, i) => [n.id, { x: W / 2 + (rnd() - .5) * W * .6, y: H / 2 + (rnd() - .5) * H * .6, vx: 0, vy: 0 }]));
  const k = opts.spring ?? Math.min(W, H) / Math.max(3, Math.sqrt(nodes.length) * 1.6);
  const rep = opts.repel ?? k * k * 1.2;
  const deg = new Map();
  for (const e of edges) { deg.set(e.a, (deg.get(e.a) || 0) + 1); deg.set(e.b, (deg.get(e.b) || 0) + 1); }
  for (let it = 0; it < 320; it++) {
    const t = 1 - it / 320;
    for (const a of nodes) for (const b of nodes) {
      if (a.id >= b.id) continue;
      const pa = pos.get(a.id), pb = pos.get(b.id);
      let dx = pa.x - pb.x, dy = pa.y - pb.y; let d2 = dx * dx + dy * dy || 1; const d = Math.sqrt(d2);
      const f = rep / d2 * (1 + (a.w || 0) + (b.w || 0)) * .5;
      dx = dx / d * f; dy = dy / d * f;
      pa.vx += dx; pa.vy += dy; pb.vx -= dx; pb.vy -= dy;
    }
    for (const e of edges) {
      const pa = pos.get(e.a), pb = pos.get(e.b);

function renderFlowMap(f) {

  s.setAttribute('viewBox', `0 0 ${W} ${H}`); s.innerHTML = '';
  const order = []; for (const st of f.steps) for (const tn of st.tables) if (!order.includes(tn)) order.push(tn);
  const set = new Set(order);
  const nodes = order.map((n) => ({ id: n, title: label(n), group: groupOf(n), w: Math.max(110, label(n).length * 8 + 30), h: 40 }));
  const edges = links.filter((l) => set.has(l.from) && set.has(l.to) && l.from !== l.to).map((l) => ({ a: l.from, b: l.to, link: l }));
  // left-to-right by first appearance, spread vertically
  const cols = Math.max(1, Math.min(order.length, Math.floor(W / 190)));
  const pos = new Map();
  order.forEach((n, i) => { const c = i % cols, r = Math.floor(i / cols); const rows = Math.ceil(order.length / cols); pos.set(n, { x: (W / (cols + 1)) * (c + 1), y: (H / (rows + 1)) * (r + 1) + (c % 2 ? 14 : -14) }); });
  const gE = el('g'), gN = el('g'); s.append(gE, gN);
  const cur = new Set(f.steps[stepIdx].tables);
  for (const e of edges) { const pa = pos.get(e.a), pb = pos.get(e.b); const path = el('path', { d: edgePath(pa, pb, e.a, e.b, 0), class: 'link' + (e.link.kind === 'inferred' ? ' loose' : e.link.kind === 'junction' ? ' knot' : '') + ((cur.has(e.a) && cur.has(e.b)) ? ' lit' : '') }); gE.append(path); }
  for (const n of nodes) {
    const p = pos.get(n.id); const g = el('g', { class: 'node' + (cur.has(n.id) ? ' selected' : ' dim'), transform: `translate(${p.x - n.w / 2} ${p.y - n.h / 2})` });
    g.style.setProperty('--gc', gcolor(n.group));
    g.append(el('rect', { width: n.w, height: n.h }), el('circle', { cx: 14, cy: 20, r: 5, fill: gcolor(n.group) }), el('text', { x: 26, y: 25 }, n.title));
    g.addEventListener('click', () => { showView('map'); select(n.id); });
    gN.append(g);
  }
}

// ---- words
function renderWords() {
  const w = $('#words'); w.innerHTML = '';
  w.append(h('h2', {}, 'How to read the map'), h('p', { class: 'lede' }, 'Every box is a table: one kind of record the app keeps, like a location or a work log. Lines show how records point at each other.'));
  const howto = h('div', { class: 'howto' });
  const mk = (svgInner, title, text) => { const d = h('div'); d.innerHTML = `<svg viewBox="0 0 220 34">${svgInner}</svg>`; d.append(h('b', {}, title), h('span', {}, text)); howto.append(d); };
  mk('<line x1="10" y1="17" x2="210" y2="17" stroke="var(--line-strong)" stroke-width="2"/>', 'Belongs to', 'A solid line means each record on one end belongs to one record on the other. A location belongs to a client; a client has many locations.');
  mk('<line x1="10" y1="17" x2="210" y2="17" stroke="var(--loose)" stroke-width="2" stroke-dasharray="6 4"/>', 'Loose link', 'A dashed line means the app writes a reference, but the database never checks it. These can quietly point at deleted records.');
  mk('<line x1="10" y1="17" x2="210" y2="17" stroke="var(--accent)" stroke-width="4"/>', 'Any combination', 'A thick teal line means the two kinds of records can be paired freely, like employees and the locations they are assigned to.');
  mk('<circle cx="110" cy="17" r="6" fill="var(--auto)"/>', 'Automatic action', 'An amber dot on a box means something happens on its own when a record there is added or changed, such as an audit entry being written.');
  mk('<rect x="10" y="4" width="200" height="26" rx="8" fill="var(--ground)" stroke="var(--line-strong)" stroke-dasharray="3 3"/>', 'From another group', 'A dashed box is a table from a different group, shown so you can see the connection. Click it to jump there.');
  mk('<rect x="10" y="4" width="200" height="26" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>', 'Hub', 'A thick border marks a table that many others point at. Users and locations are the hubs of this app.');
  w.append(howto);
  w.append(h('h2', {}, 'Words you will run into'));
  const dl = h('dl');
  for (const [k, v] of Object.entries(DATA.terms)) dl.append(h('dt', {}, k), h('dd', {}, v));
  w.append(dl);
}

// ---- views
function showView(v) {
  state.view = v;
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', String(b.dataset.view === v));
  for (const s of document.querySelectorAll('.view')) s.classList.toggle('active', s.id === `view-${v}`);
  if (v === 'map') render(); if (v === 'flows') renderFlows(); if (v === 'words') renderWords();
}
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => showView(b.dataset.view));
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (state.view === 'map') render(); if (state.view === 'flows') renderFlows(); }, 120); });

renderRail(); renderPanel(); render();
})();
</script>
